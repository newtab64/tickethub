version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: tickethub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickethub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tickethub_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickethub} -d ${POSTGRES_DB:-tickethub_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: tickethub-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: tickethub-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Web doc su kien o phia may chu; trong container, localhost khong phai may chay API.
      - API_URL=${WEB_API_URL:-http://host.docker.internal:4000/api/v1}
    extra_hosts:
      - 'host.docker.internal:host-gateway'


volumes:
  postgres_data:
  redis_data:
